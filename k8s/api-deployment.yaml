apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-service

  template:
    metadata:
      labels:
        app: api-service

    spec:
      containers:
        - name: api-service

          image: shashikarandev/taskflow-api:latest

          ports:
            - containerPort: 5000

          env:
            - name: REDIS_HOST
              value: redis

            - name: POSTGRES_HOST
              value: postgres

            - name: POSTGRES_DB
              value: tasksdb

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: postgres

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "100m"
              memory: "128Mi"