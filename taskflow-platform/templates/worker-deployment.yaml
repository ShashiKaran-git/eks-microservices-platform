apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker

spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker

          image: {{ .Values.worker.image }}

          env:
            - name: REDIS_HOST
              value: redis

            - name: POSTGRES_HOST
              value: postgres

            - name: POSTGRES_DB
              value: {{ .Values.postgres.db }}

            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}

            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password }}

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "100m"
              memory: "128Mi"