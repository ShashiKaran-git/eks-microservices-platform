<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Platform</title>

    <style>

        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .task {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #94a3b8;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>🚀 TaskFlow Platform</h1>

    <form method="POST">

        <input
            type="text"
            name="text"
            placeholder="Enter task..."
            required
        >

        <button type="submit">
            Submit
        </button>

    </form>

    {% for task in tasks %}

    <div class="task">

        <h3>{{ task.text }}</h3>

        <div class="status">
            Status: {{ task.status }}
        </div>

        <div class="status">
            Result: {{ task.result }}
        </div>

    </div>

    {% endfor %}

</div>

</body>
</html>
